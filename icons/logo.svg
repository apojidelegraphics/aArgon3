<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2a3f"/><stop offset=".55" stop-color="#081626"/><stop offset="1" stop-color="#040b16"/></linearGradient>
    <radialGradient id="glow" cx=".47" cy=".55" r=".5"><stop offset="0" stop-color="#5ce1ff" stop-opacity=".26"/><stop offset=".6" stop-color="#5ce1ff" stop-opacity=".05"/><stop offset="1" stop-color="#5ce1ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="160" y1="190" x2="340" y2="380"><stop offset="0" stop-color="#c2f8ff"/><stop offset=".45" stop-color="#5ce1ff"/><stop offset="1" stop-color="#a88bff"/></linearGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="200" y2="0"><stop offset="0" stop-color="#c2a6ff"/><stop offset=".5" stop-color="#a6f1ff"/><stop offset="1" stop-color="#6fe6ff"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="halo" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="9"/></filter>
    <mask id="onA" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><g stroke="#fff" stroke-width="50" fill="none" stroke-linecap="round"><circle cx="234" cy="290" r="78"/><path d="M312 200v168"/></g></mask>
    <clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- the orbit, back half (behind the a) -->
    <g transform="translate(256 286) rotate(-20)"><path d="M-200 0A200 62 0 0 1 200 0" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round" opacity=".38"/></g>
    <!-- the a -->
    <g filter="url(#soft)" opacity=".5" stroke="#5ce1ff" stroke-width="50" fill="none" stroke-linecap="round"><circle cx="234" cy="290" r="78"/><path d="M312 200v168"/></g>
    <g stroke="url(#glyph)" stroke-width="50" fill="none" stroke-linecap="round"><circle cx="234" cy="290" r="78"/><path d="M312 200v168"/></g>
    <!-- the orbit, front half (over the a, with a dark gap so it reads as in front) -->
    <g mask="url(#onA)"><path transform="translate(256 286) rotate(-20)" d="M200 0A200 62 0 0 1 -200 0" fill="none" stroke="#071422" stroke-width="17" stroke-linecap="round"/></g>
    <g transform="translate(256 286) rotate(-20)" fill="none" stroke-linecap="round">
      <path d="M200 0A200 62 0 0 1 -200 0" stroke="url(#ring)" stroke-width="7"/>
    </g>
    <!-- the 3 moon, sitting on the ring -->
    <circle cx="391.0" cy="196.2" r="31" fill="#b18cff" filter="url(#halo)" opacity=".9"/>
    <circle cx="391.0" cy="196.2" r="27" fill="#071422"/>
    <circle cx="391.0" cy="196.2" r="23" fill="#c7b0ff"/>
    <text x="391.0" y="207.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="31" fill="#140d2b">3</text>
  </g>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#5ce1ff" stroke-opacity=".16" stroke-width="3"/>
</svg>
