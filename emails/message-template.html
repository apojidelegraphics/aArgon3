<!--
  aARgon3 · EmailJS "gift + reminder" template (2.4)
  In EmailJS: Email Templates → Create New Template, then:
    • Subject:     {{subject}}
    • To Email:    {{to_email}}
    • From Name:   {{from_name}}
    • Reply To:    {{reply_to}}
    • Content:     switch the editor to code (<>) and paste everything below this comment.
  Save, copy the template id (template_…) into the terminal: Settings → Email → "Gift + reminder template".
  Fields aARgon3 fills in: subject, heading, message, button_label, button_url, code, store_name, to_name, site_url.
-->
<div style="margin:0;padding:0;background:#040b14;">
  <div style="max-width:560px;margin:0 auto;padding:32px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;color:#d8e6f2;">
    <div style="font:700 12px/1 Menlo,Consolas,monospace;letter-spacing:.3em;color:#5ce1ff;margin-bottom:22px;">AARGON3 · {{store_name}}</div>
    <div style="background:#0b1a2a;border:1px solid #1d3348;border-radius:18px;padding:28px;">
      <h1 style="margin:0 0 14px;font-size:24px;line-height:1.2;color:#ffffff;">{{heading}}</h1>
      <div style="font-size:15.5px;line-height:1.6;color:#b8c9d8;white-space:pre-line;">{{message}}</div>
      {{#code}}<div style="margin:22px 0 4px;padding:14px 16px;border-radius:12px;background:#06121e;border:1px dashed #2b4a66;font:700 22px/1 Menlo,Consolas,monospace;letter-spacing:.12em;color:#ffffff;text-align:center;">{{code}}</div>{{/code}}
      {{#button_url}}<div style="margin-top:24px;"><a href="{{button_url}}" style="display:inline-block;padding:13px 22px;border-radius:12px;background:#5ce1ff;color:#04121c;font-weight:700;font-size:15px;text-decoration:none;">{{button_label}}</a></div>{{/button_url}}
    </div>
    <p style="font-size:12.5px;line-height:1.5;color:#6f8599;margin:18px 4px 0;">Sent by {{store_name}} through aARgon3. Questions? Just reply to this email. <a href="{{site_url}}" style="color:#5ce1ff;">{{site_url}}</a></p>
  </div>
</div>
